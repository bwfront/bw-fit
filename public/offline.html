<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#244f78">
    <title>Offline · bw-fit</title>
    <style>
      :root { color-scheme: light dark; font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; background: #e9edf1; color: #17232d; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 420px); padding: 28px; box-sizing: border-box; border: 1px solid #cbd3da; border-radius: 22px; background: #f7f9fa; box-shadow: 0 14px 40px rgba(26,43,57,.09); }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .08em; }
      .brand::before { content: ""; width: 7px; height: 26px; background: #b54727; transform: skew(-12deg); }
      h1 { margin: 36px 0 12px; font-size: clamp(42px, 13vw, 64px); line-height: .88; text-transform: uppercase; }
      p { margin: 0 0 24px; color: #5f6d77; line-height: 1.5; }
      button { min-height: 46px; width: 100%; border: 1px solid #244f78; border-radius: 14px; color: white; background: #244f78; font: 700 16px inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid #b54727; outline-offset: 3px; }
      @media (prefers-color-scheme: dark) { :root { background: #111920; color: #edf2f5; } main { background: #19242d; border-color: #30404b; } p { color: #95a4af; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">bw-fit</div>
      <h1>Keine Verbindung</h1>
      <p>Für Trainingsdaten braucht bw-fit wieder eine Verbindung zu deinem Server.</p>
      <button type="button" onclick="location.reload()">Erneut verbinden</button>
    </main>
  </body>
</html>
